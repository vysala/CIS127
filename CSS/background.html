<!DOCTYPE html>
<html>
  <head>
    <meta charset ="utf-8">
    <title>
      Background
    </title>
    <style>
      .bluebox{
        background-origin: content-box;
        background-size: 100% 100%;
        background-image: url(/images/hope.jpg);
        background-repeat: no-repeat;
        height: 100px;
		width:auto;
		border: 10px #e8c14e ridge;
        margin: 20px;
        padding: 16px;
        outline-style: solid;
		outline-color: #bac2f4;
		outline-width: thick;
        
		color: rgb(0, 0, 255);
        text-align: center;
        text-decoration:solid;
       
    } 
	
    .yellowbox{
    padding: 10px 5px 7px 3em;
     margin: 60px;
     border-width: 10px 15px 5px 10px;
	 border-color: black green orange yellow;
	 border-style:ridge;
     height: 100px;
	 width: auto;
     background-size: 100px 100px;
     background-repeat: no-repeat;
	 background-origin: border-box;
     background-image: url(/images/hope.jpg);
	} 

    
		
	
				
		
			

	  .greenbox{
		background-color: #a2c522;
		height: 100px;
		width: 100px;
		padding: 50px;
		border-width: 10px;
		border-style: rigid;
		border-color: #28ccb6;
		border-radius:80px;
		margin: 60px 10px;
	  } 
	  
      p{
		margin: 0;
		background-color: #429ca4;
	  }

</style>
	  



    </style>
	
  </head>
  
  <body>
    <div class="bluebox">
      <p>
        CSM.
      </p>
      
    </div>
    <div class="yellowbox">
      <p>
        Skyline.
      </p>
      
    </div>
    <div class="greenbox">
      <p>
        Canada.
      </p>
      
    </div>
  </body>
  
  
</html>
