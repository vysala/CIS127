<!DOCTYPE html>
<html>
    <head>
        <title>Flexbox</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" type="text/css" href="styling.css">
    </head>
    

<style>

/*Let's make sure that the dimensions of any box includes its border and padding, this gives us an easy way of sizing our elements*/
 * {
    box-sizing: border-box;
} 

/*style the container*/
.container{
   display: flex;
    background-color: #000000;
    height: 200px;
    margin: 10px;
    flex-wrap: wrap-reverse;
    flex-direction:row;
     justify-content: center; 
  
}

/*style divs inside the container*/
.container > div{
    background-color: #66a5AD;
    color: aliceblue;
    text-align: center;
    padding: 20px;
    margin: 2px;
    border: 3px #C4DFE6 solid;
}


#facebook{
    font-size: 10px;
}


</style>
<body>
        <div class="container">
            <div id="apple">Apple</div>
            <div id="facebook">Facebook</div>
            <div id="microsoft">Microsoft</div>
            <div id="samsung">Samsung</div>
            <div id="google">Google</div>
            <div id="amazon">Amazon</div>
        </div>

    </body>
</html>
