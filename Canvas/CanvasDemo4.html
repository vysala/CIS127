<!-- Draw a rectangle : The basic syntax of the rect() method can be given with: 
 context.rect(x, y, width, height); -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawing a Rectangle on the Canvas</title>
<style>
	canvas {
		border: 1px solid #000;
	}
</style>
<script>
    window.onload = function() {
        // Get the canvas element from the HTML using its ID
        var canvas = document.getElementById("myCanvas");
         // Get the 2D drawing context, which is used for drawing shapes
        var context = canvas.getContext("2d");
        // Draw a rectangle
        // Parameters:
        // 50  - x-coordinate of the top-left corner
        // 50  - y-coordinate of the top-left corner
        // 200 - Width of the rectangle (in pixels)
        // 100 - Height of the rectangle (in pixels)
        context.rect(50, 50, 200, 100); 
        context.stroke();
    };
</script>
</head>
<body>
    <canvas id="myCanvas" width="300" height="200"></canvas>
</body>
</html>
