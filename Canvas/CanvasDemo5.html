<!-- Drawing a Circle -->
<!--There is no specific method for creating circle like rectangle's rect() method. However, you can create a fully enclosed arc such as circle using the arc() method.-->
<!-- context.arc(centerX, centerY, radius, 0, 2 * Math.PI, false); -->


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawing a Circle on the Canvas</title>
<style>
	canvas {
		border: 1px solid #000;
	}
</style>
<script>
    window.onload = function() {
        var canvas = document.getElementById("myCanvas");
        var context = canvas.getContext("2d");
        // Draw a complete circle
        // Parameters:
        // 150          - x-coordinate of the center
        // 100          - y-coordinate of the center
        // 70           - Radius of the circle (in pixels)
        // 0            - Start angle (0 radians = 0°)
        // 2 * Math.PI  - End angle (360° or a full circle)
        // false        - Draw clockwise
        context.arc(150, 100, 70, 0, 2 * Math.PI, false);
        context.stroke();
    };
</script>
</head>
<body>
    <canvas id="myCanvas" width="300" height="200"></canvas>
</body>
</html>
