<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <title>For sale: 2026 Tesla Model</title>
      <style>
         h1 {
            color: green;
            background-color: lightgray;
         }
         p {
            font-family: arial;
            margin-left: 10px;
         }
         strong {
            background-color: lightgreen;
            padding: 5px;
         } 
      </style>
   </head>
   <body>
      <h1 id="bike-heading">Tesla Model3 - $50000</h1>
      <p>year: <strong>2026</strong></p>
      <p>make and model: <strong>Tesla Model 3</strong></p>
      <p>condition: <strong>excellent</strong></p>
      <p>odometer: <strong>9700</strong></p>
    
      <p>Change heading color to: 
         <button id="white-btn">White</button>
         <button id="green-btn">Green</button>
         <button id="red-btn">Red</button>
      </p>

      <script>
         let whiteBtn = document.getElementById("white-btn");
         whiteBtn.addEventListener("click", function() {
            changeHeadingColor("white");
         });
         
         let greenBtn = document.getElementById("green-btn");
         greenBtn.addEventListener("click", function() {
            changeHeadingColor("green");
         });         

         let redBtn = document.getElementById("red-btn");
         redBtn.addEventListener("click", function() {
            changeHeadingColor("red");
         }); 

         function changeHeadingColor(newColor) {
            let heading = document.getElementById("bike-heading");
            heading.style.color = newColor;
            
         }
       

      </script>
   </body>
</html>
